[project]
name = "pdfengine"
version = "0.1.0"
description = "PDFnix engine: local HTTP service that does all PDF work"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "pymupdf>=2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
